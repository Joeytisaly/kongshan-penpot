name: CI

on:
  push:
    branches: [main]
  pull_request:

# P11-7：同一分支只保留最新一次运行，取消已被新提交取代的旧运行
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # 部署不在 CI 内：保持 wrangler deploy 的授权节奏（见 AGENTS.md / PROGRESS.md）
